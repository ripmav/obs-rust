# P1-29.1 (WP-31): cbindgen config for the obs-ffi C ABI surface.
#
# language = C, cpp_compat = true, no function prefix. The generated header
# must declare exactly the `#[no_mangle] extern "C"` bridges and the
# `#[repr(C)]` types they use — nothing else. `test/conformance/cbindgen-header-diff.py`
# (P1-29.2) diffs every function declaration against the C reference headers
# under `libobs/` and reds CI on drift.
language = "C"
cpp_compat = true
# The C reference headers use `#pragma once`.
pragma_once = true

[export]
# Not part of the C ABI surface: the C symbols the bridges CALL (extern
# imports from base-logging.c / bmem.c) and the `cargo test` link stand-ins
# in the abi_cf_lexer test module. Keep this list in sync with the
# `unsafe extern "C"` blocks and test modules in src/.
exclude = [
    # lib.rs `mod ffi` — the C logging shim (base-logging.c) and base.c symbols.
    "obs_ffi_log",
    "base_get_log_handler",
    "base_set_log_handler",
    "base_set_crash_handler",
    # abi_common.rs — the C allocator (bmem.c).
    "bfree_raw",
    "brealloc",
    # abi_platform.rs — the C shim's bcrash (base-logging.c).
    "bcrash",
    # abi_darray.rs — the C shim's bcrash (R-A13 OOM path; same symbol as
    # abi_platform's, a separate extern block per module).
    # (same name as above — cbindgen dedupes by name)
    # abi_bitstream.rs — bitstream_reader_read_bit: linkable in the C
    # reference (bitstream.c) but declared in NO C header; the conformance
    # runner declares it locally (serial_runner.c). No reference declaration
    # to diff against, so it stays out of the generated header.
    "bitstream_reader_read_bit",
    # abi_bpm.rs — C services the bridge calls (the output/encoder/video
    # counter surface — the conformance runner links fakes, production
    # libobs — and the injected wall-clock base; the runner links the
    # identity model). Declared in libobs headers, not in the diffed C
    # reference headers.
    "obs_encoder_get_codec",
    "obs_encoder_get_encoded_frames",
    "obs_encoder_get_name",
    "obs_encoder_packet_release",
    "obs_encoder_video",
    "obs_get_lagged_frames",
    "obs_get_total_frames",
    "obs_output_get_frames_dropped",
    "obs_output_get_total_frames",
    "os_nstime_to_timespec",
    "video_output_get_skipped_frames",
    "video_output_get_total_frames",
    # abi_happy_eyeballs.rs — build_addr_list: file-local (static) in the C
    # reference, declared in NO C header; the conformance runner declares
    # it locally in swap mode. No reference declaration to diff against.
    "build_addr_list",
    # abi_file_updater.rs — get_path: file-local (static) in the C
    # reference, declared in NO C header; the conformance runner declares
    # it locally in swap mode.
    "get_path",
    # abi_happy_eyeballs.rs — C services the bridge calls (resolver / clock
    # / strerror); declared in system / platform headers, not in the diffed
    # C reference headers.
    "getaddrinfo",
    "obs_ffi_get_sock_error",
    "strerror",
    "os_gettime_ns",
    # abi_source_profiler.rs — C services the bridge calls (the graphics
    # timers, the task queue, the source async accessors, the
    # graphics-context shim and the non-variadic log entry point);
    # declared in the libobs graphics / obs headers, not in the diffed
    # C reference headers (os_gettime_ns: platform-nix.c / the stubs).
    # gs_enter_context / gs_leave_context: the `cargo test` stand-ins of
    # the srcprof shim's calls (the cf-lexer stand-in precedent).
    "gs_enter_context",
    "gs_leave_context",
    "gs_timer_begin",
    "gs_timer_create",
    "gs_timer_destroy",
    "gs_timer_end",
    "gs_timer_get_data",
    "gs_timer_range_begin",
    "gs_timer_range_create",
    "gs_timer_range_destroy",
    "gs_timer_range_end",
    "gs_timer_range_get_data",
    "obs_ffi_srcprof_enter_context",
    "obs_ffi_srcprof_leave_context",
    "obs_queue_task",
    "obs_source_get_last_async_ts",
    "obs_source_get_output_flags",
    # abi_file_updater.rs — C services the bridge calls (obs-data.c,
    # libcurl, the platform file API, base-logging.c, pthreads) and the
    # file-local thread entry points (static in the C reference, declared
    # locally by the conformance runner in swap mode).
    "blog",
    "curl_easy_cleanup",
    "curl_easy_getinfo",
    "curl_easy_init",
    "curl_easy_perform",
    "curl_easy_setopt",
    "curl_slist_append",
    "curl_slist_free_all",
    "obs_data_addref",
    "obs_data_array_count",
    "obs_data_array_item",
    "obs_data_create",
    "obs_data_create_from_json",
    "obs_data_create_from_json_file",
    "obs_data_get_array",
    "obs_data_get_int",
    "obs_data_get_string",
    "obs_data_release",
    "obs_data_save_json",
    "obs_data_set_string",
    "os_copyfile",
    "os_mkdir",
    "os_quick_write_utf8_file",
    "os_rename",
    "os_rmdir",
    "os_unlink",
    "pthread_create",
    "pthread_join",
    "single_file_thread",
    "update_thread",
    # abi_deque.rs — test-only layout-sharing symbols (P1-04.2): the deque
    # runner declares them locally; there is no C reference declaration.
    "obs_ffi_deque_new",
    "obs_ffi_deque_free",
    # abi_cf_lexer.rs test stand-ins (cargo test links these instead of
    # bmem.c + the platform file API).
    "bmalloc",
    "bfree",
    "os_fopen",
    "os_fread_utf8",
    "fclose",
]
