[package]
name = "obs-ffi"
description = "C ABI surface: generated obs.h, vtable adapters for C plugins (Phase 4)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[build-dependencies]
cc = "1.11.2"

[dev-dependencies]
# P1-13.3 (WP-37): the facade's scenario test emits through the macros.
log = "0.4"
# P1-29.1 (WP-31): the header generator for tests/header_diff.rs. The
# version is pinned in Cargo.lock — do not replace it with a
# cargo-installed cbindgen binary (the conformance job must not depend
# on a separate toolchain install).
cbindgen = "0.29.4"

[dependencies]
log = "0.4"
obs-data = { path = "../obs-data" }
obs-hotkey-names = { path = "../obs-hotkey-names" }
obs-math = { path = "../obs-math" }
obs-properties = { path = "../obs-properties" }
obs-signal = { path = "../obs-signal" }
obs-util = { path = "../obs-util" }
obs-util-small = { path = "../obs-util-small" }
obs-netutil = { path = "../obs-netutil" }
obs-file-updater = { path = "../obs-file-updater" }
obs-bpm = { path = "../obs-bpm" }

[features]
# Compile the C-ABI bridges that need libobs C symbols at link time
# (the OBS_ENABLE_RUST=ON swap build). Off by default so plain `cargo test`
# binaries link without the C tree.
c-swap = []

[lib]
crate-type = ["staticlib", "rlib"]
