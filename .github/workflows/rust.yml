name: ci

on:
  # All PRs, not just base=main: WP PRs are stacked on the Phase 0 head and
  # must run the same pipeline (P0-09).
  # Docs-only changes (docs/**, odd/**, *.md) are excluded: they run the
  # markdown format check only (workflows/markdown.yml).
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!odd/**"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!odd/**"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
          version: 0.9.151
      - name: nextest
        run: cargo nextest run --workspace --profile ci
      - name: upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml

  conformance:
    name: conformance (C reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: checkout OBS reference (pinned 33.0.1)
        uses: actions/checkout@v7
        with:
          repository: obsproject/obs-studio
          ref: 33.0.1
          path: obs-studio
      - name: link the reference into the repo
        run: tools/link-obs-source.sh "${GITHUB_WORKSPACE}/obs-studio"
      - name: header diff (cbindgen vs C reference)
        # P1-29.3 (WP-31): the cbindgen-generated obs-ffi header must declare
        # exactly the C reference signatures; red on any drift. Needs only
        # cargo + python3 (both preinstalled) and the linked checkout.
        run: python3 test/conformance/cbindgen-header-diff.py
      - name: install system deps
        run: |
          sudo apt-get update
          # jansson: the spec (S-014 §6.2) pins jansson 2.15.1 semantics
          # (shortest round-trip reals), which distro packages do not provide;
          # build it from source below. Everything else is a distro package
          # (uuid-dev = the libuuid-dev rename in Ubuntu 26.04).
          sudo apt-get install -y cmake uthash-dev uuid-dev zlib1g-dev \
            libcurl4-openssl-dev libglib2.0-dev libpulse-dev
      - name: simde (pinned)
        run: |
          git clone -q https://github.com/simd-everywhere/simde.git
          cd simde && git checkout -q 24fa5420cd413621648063f04a09fa35c7afacf7
      - name: jansson 2.15.1 (pinned)
        run: |
          git clone -q --depth 1 --branch v2.15.1 https://github.com/akheron/jansson.git
          cmake -S jansson -B jansson/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/jansson"
          cmake --build jansson/build -j4
          cmake --install jansson/build
      - name: check (C reference vs committed vectors)
        env:
          CONFORMANCE_EXTRA_CFLAGS: >-
            -I${{ github.workspace }}/simde
            -I${{ runner.temp }}/jansson/include
            -L${{ runner.temp }}/jansson/lib
            -I/usr/include/glib-2.0 -I/usr/include/gio-2.0 -I/usr/include/gio-unix-2.0
            -I/usr/lib/x86_64-linux-gnu/glib-2.0/include
        run: |
          # run.sh must be invoked from test/conformance: gen/helpers.sources
          # uses relative -I paths against that directory.
          # Build dirs go to $RUNNER_TEMP (not the /tmp mktemp default) so
          # the runners cannot be starved by a small /tmp.
          status=0
          for area in $(grep -vE '^[[:space:]]*(#|$)' test/conformance/ci-areas.txt); do
            mkdir -p "$RUNNER_TEMP/conform-check/$area"
            (cd test/conformance && CONFORMANCE_BUILD_DIR="$RUNNER_TEMP/conform-check/$area" ./run.sh check "$area") || status=1
          done
          exit "$status"
      - name: swap (Rust staticlib replaces the ported C sources)
        env:
          CONFORMANCE_EXTRA_CFLAGS: >-
            -I${{ github.workspace }}/simde
            -I${{ runner.temp }}/jansson/include
            -L${{ runner.temp }}/jansson/lib
            -I/usr/include/glib-2.0 -I/usr/include/gio-2.0 -I/usr/include/gio-unix-2.0
            -I/usr/lib/x86_64-linux-gnu/glib-2.0/include
        run: |
          status=0
          for area in $(grep -vE '^[[:space:]]*(#|$)' test/conformance/ci-areas.txt); do
            mkdir -p "$RUNNER_TEMP/conform-swap/$area"
            (cd test/conformance && CONFORMANCE_BUILD_DIR="$RUNNER_TEMP/conform-swap/$area" ./run.sh swap "$area") || status=1
          done
          exit "$status"
      - name: reference dump (P0-14.5): regenerate goldens + diff
        # Builds obs-ref-dump against the pinned 33.0.1 C sources (same
        # compile recipe as the conformance runners), regenerates every
        # dump and diffs against the committed goldens. Red on any drift.
        # The trailing "# section: rand" block of the math dump uses libc
        # rand() (platform-dependent stream) and is stripped from both
        # sides before the diff.
        env:
          CONFORMANCE_EXTRA_CFLAGS: >-
            -I${{ github.workspace }}/simde
            -I${{ runner.temp }}/jansson/include
            -L${{ runner.temp }}/jansson/lib
            -I/usr/include/glib-2.0 -I/usr/include/gio-2.0 -I/usr/include/gio-unix-2.0
            -I/usr/lib/x86_64-linux-gnu/glib-2.0/include
        run: |
          mkdir -p "$RUNNER_TEMP/refdump"
          LIBOBS="$GITHUB_WORKSPACE/obs-studio/libobs" \
            JANSSON="$RUNNER_TEMP/jansson" \
            OUT="$RUNNER_TEMP/refdump/obs-ref-dump" \
            bash test/ref-dump/build.sh
          status=0
          for area in math data media; do
            "$RUNNER_TEMP/refdump/obs-ref-dump" "$area" 2>/dev/null \
              | awk '/^# section: rand/{exit} {print}' > "$RUNNER_TEMP/refdump/$area.out"
            awk '/^# section: rand/{exit} {print}' "test/golden/ref-dump/$area.golden" > "$RUNNER_TEMP/refdump/$area.golden-stripped"
            diff -u "$RUNNER_TEMP/refdump/$area.golden-stripped" "$RUNNER_TEMP/refdump/$area.out" || status=1
          done
          exit "$status"

  c-swap:
    name: c-swap (obs-ffi non-test build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
          version: 0.9.151
      # The abi_* bridges compile only under cfg(test) or --features c-swap;
      # this job lints and builds the non-test (staticlib) configuration and
      # runs the tests with the feature (finding 16 of the 2026-11-21 review).
      - name: clippy (c-swap, non-test)
        run: cargo clippy -p obs-ffi --features c-swap -- -D warnings
      - name: build staticlib
        run: cargo build -p obs-ffi --release --features c-swap
      - name: nextest (c-swap)
        run: cargo nextest run -p obs-ffi --features c-swap --profile ci

  supply-chain:
    name: supply chain (deny + audit + miri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo deny
        run: cargo deny check
      - name: cargo audit
        run: cargo audit
      - name: miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri
          # --lib: unit tests only. Subprocess re-exec tests (bmem_fatal) are
          # incompatible with Miri isolation and already run in the test job.
          # obs-properties / obs-util-small / obs-hotkey-names were missing
          # (finding 12 of the 2026-11-21 review).
          cargo +nightly miri test -p obs-util -p obs-math -p obs-data -p obs-signal \
            -p obs-properties -p obs-util-small -p obs-hotkey-names --lib

  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Summary is captured once here; the PR comment reuses the file instead
      # of re-running cargo llvm-cov.
      - name: collect coverage
        run: |
          cargo llvm-cov --workspace --summary-only --output-path lcov.info > coverage-summary.txt
          cat coverage-summary.txt
      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: |
            lcov.info
            coverage-summary.txt
      # One coverage comment per PR: the HTML marker identifies our comment,
      # so re-runs edit it in place instead of piling up new comments.
      - name: comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          {
            echo "<!-- coverage-summary -->"
            echo "### Coverage"
            echo
            echo '```text'
            cat coverage-summary.txt
            echo '```'
          } > coverage-comment.md
          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- coverage-summary -->")) | .id' \
            | tail -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" \
              -f body="$(cat coverage-comment.md)" > /dev/null
            echo "Updated coverage comment $COMMENT_ID"
          else
            gh pr comment "$PR" --repo "$REPO" --body-file coverage-comment.md
          fi
